  <style>@layer base, studio, components, responsive;
@layer base {
  :root { --glass-bg:linear-gradient(125deg,rgba(255,255,255,.50),rgba(249,251,255,.34) 50%,rgba(240,245,252,.42)); --glass-shadow:inset 0 1px 1px rgba(255,255,255,.90),inset 0 -1px 0 rgba(255,255,255,.25),0 12px 30px rgba(61,78,105,.08); --glass-blur:blur(26px) saturate(104%); --glass-edge:rgba(255,255,255,.88); --pickup-code:#172233; }
  :root { --bg:#e8edf4; --surface:#f7f9fc; --ink:#172233; --muted:#626d7d; --line:#dce3ed; --blue:#0867f2; --code:#1257c8; --teal:#087f7d; --teal-bg:#dff2ef; --amber:#7b591d; --amber-bg:#fbefd9; --red:#b33f3b; --radius:24px; --shadow:0 8px 24px rgba(47,65,90,.07); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); font-synthesis:none; }
  body { margin:0; background:#edf0f5; }
  :where(div,section,article,header,footer,nav,aside,main,label,button,input,textarea,select,a) { box-sizing:border-box; }
  :where(button,input,textarea,select) { font:inherit; }
  button { cursor:pointer; color:inherit; }
  button:disabled { cursor:default; opacity:.5; }
  :where(button,input,textarea,select,a):focus-visible { outline:3px solid #1676ec; outline-offset:3px; }
  :where(h1,h2,h3,p) { margin:0; }
  .icon { width:22px; height:22px; flex-shrink:0; vertical-align:middle; }

}

  .phone::before { content:''; position:absolute; inset:0; pointer-events:none; z-index:-1; background:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22180%22%20height%3D%22180%22%20viewBox%3D%220%200%20180%20180%22%3E%3Cfilter%20id%3D%22g%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%22.82%22%20numOctaves%3D%223%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20opacity%3D%22.055%22%20filter%3D%22url(%23g)%22%2F%3E%3C%2Fsvg%3E%0A'); opacity:.18; }

  .battery::after { content:''; display:block; width:85%; height:100%; border-radius:1px; background:var(--ink); }

  .header-actions { display:flex; gap:4px; }

  .page-footer { padding:12px 16px 24px; display:flex; gap:10px; background:var(--glass-bg); border-top:1px solid var(--glass-edge); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); }

  .preview-caption { margin-top:18px; display:flex; justify-content:space-between; color:var(--muted); font-size:10px; }
  .design-notes { max-width:270px; padding-top:65px; }

  .overview { padding:36px 45px 60px; }
  .overview-title { margin-bottom:30px; display:flex; justify-content:space-between; align-items:end; }

  .overview-title p { color:var(--muted); font-size:12px; }
  .overview-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:35px 28px; align-items:start; }

  <script>/* Shared visual primitives for the review prototype; no production API calls. */
window.SCENES = [];
window.UI = (() => {
  const escape = (value = '') => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const paths = {
    box:'<path d="m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5M12 13v9M7 5.8l10 5.6"/>',
    package:'<path d="m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5M12 13v9"/>',
    list:'<rect x="5" y="5" width="14" height="17" rx="3"/><path d="M9 5V2h6v3M9 11h6M9 16h4"/>',
    user:'<circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3z"/>',
    bell:'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9M10 22h4"/>',
    pin:'<path d="M19 10c0 5-7 12-7 12S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/>',
    plus:'<path d="M12 4v16M4 12h16"/>',
    refresh:'<path d="M20 8a8 8 0 0 0-14-3L3 8M3 3v5h5M4 16a8 8 0 0 0 14 3l3-3M21 21v-5h-5"/>',
    search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
    more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
    chevron:'<path d="m9 5 7 7-7 7"/>',
    back:'<path d="m15 5-7 7 7 7"/>',
    close:'<path d="m6 6 12 12M6 18 18 6"/>',
    check:'<path d="m4 12 5 5L20 6"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',
    filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
    copy:'<rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V3H3v13h5"/>',
    scan:'<path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5M7 7v10M11 7v10M15 7v10M18 7v10"/>',
    shield:'<path d="m12 2 8 4v6c0 6-8 10-8 10S4 18 4 12V6zM8 12l3 3 5-6"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="m10 2-1 3-3 1-3-1-2 4 3 2v3l-2 2 2 4 3-1 3 1 1 3h4l1-3 3-1 3 1 2-4-3-2v-3l2-2-2-4-3 1-3-1-1-3z"/>',
    spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',
    link:'<path d="m10 7 2-2a5 5 0 0 1 7 7l-2 2M14 17l-2 2a5 5 0 0 1-7-7l2-2M8 16l8-8"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 6v1"/>',
    warning:'<path d="m12 3 10 18H2zM12 9v5M12 17v1"/>',
    download:'<path d="M12 3v13m-5-5 5 5 5-5M3 16v5h18v-5"/>',
    phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/>',
    trash:'<path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',
    edit:'<path d="m14 4 6 6M3 21l5-1L21 7l-5-5L3 15z"/>'
  };
  const icon = name => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.box}</svg>`;
  const action = (target, fallback) => target ? `data-go="${escape(target)}"` : `data-demo="${escape(fallback || '这是设计演示，未修改真实数据。')}"`;
  const button = (text,target='',kind='primary') => `<button class="btn ${escape(kind)}" ${action(target,text+' · 设计演示')}>${escape(text)}</button>`;
  const link = (text,target) => `<button class="text-action" ${action(target,text)}>${escape(text)}</button>`;
  const badge = (text,tone='neutral') => `<span class="badge ${escape(tone)}">${escape(text)}</span>`;
  const row = (title,sub='',tail='',target='') => `<button class="setting-row" ${action(target,title+' · 设计演示')}><span class="row-text"><strong>${escape(title)}</strong>${sub?`<small>${escape(sub)}</small>`:''}</span><span class="row-tail">${tail.includes('<')?tail:escape(tail)}${icon('chevron')}</span></button>`;
  const toggle = (title,desc,on) => `<label class="toggle-row"><span class="row-text"><strong>${escape(title)}</strong>${desc?`<small>${escape(desc)}</small>`:''}</span><input type="checkbox" role="switch" ${on?'checked':''}><span class="switch" aria-hidden="true"></span></label>`;
  const field = (label,value,placeholder='',type='text') => `<label class="field"><span>${escape(label)}</span>${type==='textarea'?`<textarea placeholder="${escape(placeholder)}" rows="4">${escape(value)}</textarea>`:`<input type="${escape(type)}" value="${escape(value)}" placeholder="${escape(placeholder)}">`}</label>`;
  const section = (title,content,extra='') => `<section class="section"><div class="section-heading"><h2>${escape(title)}</h2>${extra}</div>${content}</section>`;
  const note = (text,tone='neutral') => `<div class="note ${escape(tone)}">${icon(tone==='red'||tone==='amber'?'warning':'info')}<span>${escape(text)}</span></div>`;
  const kv = (label,value) => `<div class="kv"><span>${escape(label)}</span><strong>${value.includes?.('<')?value:escape(value)}</strong></div>`;
  const segmented = (items,active=0) => `<div class="segmented">${items.map((item,i)=>`<button class="${i===active?'active':''}" aria-pressed="${i===active}" ${action(Array.isArray(item)?item[1]:'', '切换至'+(Array.isArray(item)?item[0]:item))}>${escape(Array.isArray(item)?item[0]:item)}</button>`).join('')}</div>`;
  const choice = (title,desc,selected) => `<label class="choice"><input type="checkbox" ${selected?'checked':''}><span class="choice-check" aria-hidden="true">${icon('check')}</span><span class="row-text"><strong>${escape(title)}</strong>${desc?`<small>${escape(desc)}</small>`:''}</span></label>`;
  const empty = (title,desc,actionHTML='') => `<div class="empty"><span class="empty-icon">${icon('box')}</span><h2>${escape(title)}</h2><p>${escape(desc)}</p>${actionHTML}</div>`;
  const pickupCard = (p={}) => {
    const title = Array.from(p.product || '').slice(0,10).join('');
    const code = p.code || '2-2-1001';
    return `<article class="pickup-card ${p.done?'collected':''}"><div class="pickup-top"><div class="chips">${badge(p.role||'待归属',p.role==='妈妈'?'amber':p.role==='我'?'blue':'neutral')}${p.platform?`<span class="platform">${escape(p.platform)}</span>`:''}${p.multi?badge(typeof p.multi==='string'?p.multi:'共 '+p.multi+' 件','teal'):''}</div><button class="icon-button" data-go="pickup-menu" aria-label="取件码 ${escape(code)} 更多操作">${icon('more')}</button></div><div class="pickup-grid"><div class="cabinet ${!p.cabinet?'no-cabinet':''}"><small>${p.cabinet?'柜号':'取件位置'}</small><strong>${escape(p.cabinet||'驿站')}</strong></div><button class="pickup-code ${code.length>12?'long-code':''}" ${action(p.target||'pickup-detail')} aria-label="查看取件码 ${escape(code)}">${escape(code)}</button><div class="pickup-meta"><span class="pickup-product" title="${escape(p.product||'')}" aria-label="${escape(p.product||'未关联商品')}">${escape(title)}${Array.from(p.product||'').length>10?'…':''}</span><time>${escape(p.time||'')}</time><span class="pickup-source">${escape(p.source||(p.unmatched?'短信':''))}</span></div><button class="collect-button ${p.done?'done':''}" ${p.multi?'data-go="pickup-multi"':'data-collect'}>${p.done?icon('check')+'已取':'取件'}</button></div>${p.unmatched?`<div class="pickup-bottom">${link('匹配订单','pickup-match')}<span class="small muted">也可直接取件</span></div>`:''}</article>`;
  };
  const packageCard = (p={}) => `<button class="package-card" ${action(p.target||'package-detail')}><div class="hrow between"><div class="chips"><span class="platform">${escape(p.platform||'手动记录')}</span>${badge(p.role||'我')}</div>${badge(p.status||'运输中',p.tone||'blue')}</div><div class="package-product"><span class="product-art" aria-hidden="true">${icon('box')}</span><span><strong>${escape(Array.from(p.product||'日用收纳用品').slice(0,10).join(''))}</strong><small>${escape(p.price||'')}${p.date?' · '+escape(p.date):''}</small></span>${icon('chevron')}</div><div class="package-summary">${icon('clock')}<span>${escape(p.summary||'暂无新物流')}</span></div></button>`;

  return {escape,icon,button,row,toggle,field,section,badge,note,kv,segmented,choice,empty,link,pickupCard,packageCard,timeline};
})();
</script>
  <script>(() => {
  const U = window.UI;
  const mug = '雾蓝色陶瓷马克杯双杯礼盒套装';
  const box = '家用加厚透明收纳整理箱三件套';
  const socks = '柔软纯棉条纹居家袜五双装';
  const short = text => [...text].length > 10 ? [...text].slice(0, 10).join('') + '…' : text;
  const demo = (text, message = text) => `<button type="button" class="text-action" data-demo="${message}">${text}</button>`;
  const chips = (...items) => `<div class="chips">${items.join('')}</div>`;
  const wrap = html => `<div class="stack">${html}</div>`;
  const section = (title, html, extra = '') => U.section(title, `<div class="stack gap-sm">${html}</div>`, extra);
  const notification = (title, sub = '', tail = '', target = '') => `<div class="notification-item">${U.row(title, sub, tail, target)}<button type="button" class="icon-button" data-dismiss aria-label="关闭${title}">${U.icon('close')}</button></div>`;
  const notificationTabs = (active = 0) => U.segmented([['全部','notifications'],['待确认','notifications-review'],['异常','notifications-error'],['同步','notifications-sync']], active);
  const codeHero = (code = '3-2068', cabinet = '12-A', meta = '青禾小区东门驿站') => `<div class="card inset stack"><div class="hrow between">${cabinet ? U.badge('柜号 ' + cabinet, 'teal') : U.badge('短信取件', 'blue')}${demo('复制', '已复制取件码（设计演示）')}</div><div class="code-hero">${code}</div><div class="muted small">${meta}</div></div>`;

  <script>(() => {

  const displayName=s=>labels[s.id]||s.title;

  const statusbar=()=>'<div class="statusbar"><span>9:41</span><span class="status-icons">▮▮▮ ▰ <i class="battery"></i></span></div>';
  function phoneHTML(scene) {
    const top=(scene.top||[]).map(a=>`<button class="icon-button" aria-label="${U.escape(a.label)}" data-go="${U.escape(a.target)}">${U.icon(a.icon)}${a.icon==='bell'?'<span class="notification-dot">2</span>':''}</button>`).join('');
    const back=scene.back?`<button class="icon-button" aria-label="${scene.sheet?'关闭':'返回'}" data-go="${U.escape(scene.back)}">${U.icon(scene.sheet?'close':'back')}</button>`:'';
    const tabs=scene.tab?`<nav class="tabbar" aria-label="主导航">${[['pickup','box','取件列表'],['packages','list','包裹记录'],['my','user','我的']].map(([id,icon,label])=>`<button class="${scene.tab===id?'active':''}" ${scene.tab===id?'aria-current="page"':''} data-go="${id}">${U.icon(icon)}<span>${label}</span></button>`).join('')}</nav>`:'';

  }
  function renderNav(filter='') {
    const scenes=window.SCENES.filter(s=>(s.title+s.group+s.description).includes(filter));
    document.querySelector('#scene-nav').innerHTML=groups.map(group=>`<section class="nav-group"><h2>${group}</h2>${scenes.filter(s=>s.group===group).map(s=>`<button class="nav-item" data-go="${s.id}" ${s.id===active?'aria-current="page"':''}><span>${String(window.SCENES.indexOf(s)+1).padStart(2,'0')}</span>${U.escape(displayName(s))}</button>`).join('')}</section>`).join('');
  }
  function render(id,updateHash=true) {
    const scene=getScene(id)||window.SCENES[0];
    if(!scene) return;

    document.querySelector('#phone-host .phone').style.width=width+'px';
    if(scene.id==='pickup-conflict')document.querySelectorAll('#phone-host .choice input').forEach(input=>{input.type='radio';input.name='code-choice';});
    if(scene.id==='packages-filter')document.querySelectorAll('#phone-host .section').forEach((section,i)=>section.querySelectorAll('.choice input').forEach(input=>{input.type='radio';input.name='filter-'+i;}));
    document.querySelector('#scene-title').textContent=displayName(scene);
    document.querySelector('#scene-group').textContent=scene.group+' / '+String(window.SCENES.indexOf(scene)+1).padStart(2,'0');
    document.querySelector('#scene-description').textContent=scene.description;
    document.querySelector('#scene-route').textContent=scene.route||'共用组件';
    document.querySelector('#scene-position').textContent=String(window.SCENES.indexOf(scene)+1).padStart(2,'0')+' / '+window.SCENES.length+' 场景';
    document.querySelector('#scene-select').value=scene.id;
    if(updateHash) history.replaceState(null,'','#'+scene.id);
    renderNav(document.querySelector('#scene-search').value);
  }
  function overview(sheetIndex) {
    document.querySelector('#review-stage').hidden=true;
    document.querySelector('#overview').hidden=false;
    document.querySelector('#overview-button').textContent='返回逐页';
    const ids=Number.isInteger(sheetIndex)?window.SCENES.slice(sheetIndex*6,sheetIndex*6+6).map(s=>s.id):['pickup','packages','my','pickup-detail','corrections','widgets'];
    const label=Number.isInteger(sheetIndex)?`全案 ${sheetIndex+1} / ${Math.ceil(window.SCENES.length/6)}`:'主界面总览';
    document.querySelector('#overview').innerHTML=`<header class="overview-title"><div><h2>B · 细腻柔雾</h2><p>取件助手 · ${label} / ${window.SCENES.length} 个场景 / 合成示例数据</p></div><span class="eyebrow">SILVER FROST · APPROVED DIRECTION</span></header><div class="overview-grid">${ids.map((id)=>{const s=getScene(id);return `<article class="overview-item"><h3><span>${String(window.SCENES.indexOf(s)+1).padStart(2,'0')}</span>${U.escape(displayName(s))}</h3>${phoneHTML(s)}</article>`;}).join('')}</div>`;
  }
  function toast(text) { clearTimeout(toastTimer);const el=document.querySelector('#prototype-toast');el.textContent=text;el.classList.add('visible');toastTimer=setTimeout(()=>el.classList.remove('visible'),3300); }
  document.addEventListener('click',e=>{
    const dismiss=e.target.closest('[data-dismiss]');
    if(dismiss){dismiss.closest('.notification-item')?.remove();toast('已关闭本条通知；业务状态保持不变，有新进展再提醒。');return;}
    const go=e.target.closest('[data-go]');
    if(go) { if(getScene(go.dataset.go)){document.body.classList.remove('board');render(go.dataset.go);}else toast('关联页面尚未配置：'+go.dataset.go);return; }
    const collect=e.target.closest('[data-collect]');
    if(collect){const done=!collect.classList.contains('done');collect.classList.toggle('done',done);collect.closest('.pickup-card')?.classList.toggle('collected',done);collect.innerHTML=done?U.icon('check')+'已取':'取件';toast(done?'已标记领取 · 演示数据；不操作购物平台':'已撤销领取 · 演示数据');return;}
    const demo=e.target.closest('[data-demo]');if(demo){toast(demo.dataset.demo);return;}
    const size=e.target.closest('[data-width]');if(size){width=Number(size.dataset.width);document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',b===size));render(active);}
  });
  document.addEventListener('change',e=>{
    if(e.target.matches('[role=switch]'))toast('设计演示：'+(e.target.checked?'已开启':'已关闭')+'，不会改变手机或后台设置。');
    if(e.target.matches('.choice input') && ['pickup-match','pickup-multi'].includes(active)){
      const checked=document.querySelectorAll('#phone-host .choice input:checked').length;
      const primary=document.querySelector('#phone-host .page-footer .btn.primary');
      if(primary){primary.disabled=checked===0;primary.textContent=active==='pickup-match'?`确认关联所选 ${checked} 件`:`标记所选 ${checked} 件已取`;}
      if(active==='pickup-match'){const badge=document.querySelector('#phone-host .page-content > .stack > .hrow .badge');if(badge)badge.textContent=`已选 ${checked} / 2 件`;}
    }
  });
  document.querySelector('#overview-button').addEventListener('click',()=>document.querySelector('#overview').hidden?overview():render(active));
  document.querySelector('#scene-search').addEventListener('input',e=>renderNav(e.target.value));
  document.querySelector('#scene-select').innerHTML=groups.map(g=>`<optgroup label="${g}">${window.SCENES.filter(s=>s.group===g).map(s=>`<option value="${s.id}">${U.escape(displayName(s))}</option>`).join('')}</optgroup>`).join('');
  document.querySelector('#scene-select').addEventListener('change',e=>render(e.target.value));
  for(const [selector,delta] of [['#previous-scene',-1],['#next-scene',1]])document.querySelector(selector).addEventListener('click',()=>render(window.SCENES[(window.SCENES.findIndex(s=>s.id===active)+delta+window.SCENES.length)%window.SCENES.length].id));
  window.addEventListener('hashchange',()=>render(location.hash.slice(1),false));
  window.designPreview={render,overview,phoneHTML,setWidth(w){width=w;render(active);},get active(){return active;}};
  render(location.hash.slice(1)||'pickup',false);
  const query=new URLSearchParams(location.search);
  if(query.has('board')){document.body.classList.add('board');const requested=Number(query.get('sheet'));overview(query.has('sheet')&&requested>=1&&requested<=Math.ceil(window.SCENES.length/6)?requested-1:undefined);}
})();
</script>
</body>
</html>
